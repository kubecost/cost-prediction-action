name: TEST PR workflow
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  predict-pr-noapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ./
          persist-credentials: false

      # Runs the action as published, including its built-in comment: the job
      # summary always, and the PR comment on same-repository pull requests.
      - name: Run predict on test files
        id: prediction
        uses: ./
        with:
          log_level: "debug"
          path: ./test
          comment: "true"

      - name: Check the prediction output
        env:
          PREDICTION_TABLE: ${{ steps.prediction.outputs.PREDICTION_TABLE }}
        run: |
          if ! grep -Eq 'TOTAL MONTHLY COST +[0-9]+\.[0-9]{2} [A-Z]{3}' <<<"$PREDICTION_TABLE"; then
            echo '::error::PREDICTION_TABLE is empty or has no TOTAL MONTHLY COST line'
            exit 1
          fi
